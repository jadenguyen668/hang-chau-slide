<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hành trình Hàng Châu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:minmax(0,1fr) 64px}#stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;background:#050505}
#stage img,#stage video{width:100%;height:100%;object-fit:contain;display:block;min-height:0;background:#050505}#stage>img,#stage>video{position:absolute;inset:0}
#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;background:#080808;color:#d9d9d9;font-size:clamp(18px,2vw,26px);line-height:1.6;z-index:2}#message[hidden]{display:none}#message small{display:block;margin-top:12px;font-size:.7em;color:#9a9a9a}
nav{position:relative;display:flex;gap:24px;justify-content:center;align-items:center;background:#111;border-top:1px solid #242424}button{font:600 15px Arial,sans-serif;border:1px solid #555;border-radius:6px;background:#242424;color:#fff;min-width:110px;padding:11px 22px;cursor:pointer}button:hover:not(:disabled){background:#383838}button:focus-visible{outline:3px solid #e9c086;outline-offset:3px}button:disabled{opacity:.28;cursor:default}#counter{min-width:106px;text-align:center;font-size:14px;color:#bbb;font-variant-numeric:tabular-nums}
#offline{position:absolute;right:16px;top:50%;transform:translateY(-50%);max-width:32%;text-align:right;font-size:13px;line-height:1.35;color:#9a9a9a;font-variant-numeric:tabular-nums}#offline.ok{color:#7fd08a}#offline.warn{color:#e9c086}
@media(max-width:1000px){#offline{position:static;transform:none;max-width:40%}}@media(max-width:500px){nav{gap:12px}button{min-width:90px}}
</style>
</head>
<body>
<main id="stage" aria-label="Nội dung slide"><div id="message"><div>Nhấn Next để bắt đầu trình chiếu có âm thanh.<small id="hint"></small></div></div></main>
<nav aria-label="Chuyển slide"><button id="back" disabled>← Back</button><span id="counter" aria-live="polite"></span><button id="next">Next →</button><span id="offline" aria-live="polite"></span></nav>
<script>
'use strict';
const slides=[{"label":"01–03","src":"media/01-03.mp4?v=baf8b55b40","type":"video","bytes":67096095},{"label":"04","src":"media/04.png?v=4778bbfe58","type":"image","bytes":3265070},{"label":"05","src":"media/05.png?v=c9eb99da40","type":"image","bytes":3995302},{"label":"06","src":"media/06.mp4?v=e5929dd0c5","type":"video","bytes":74450756},{"label":"07","src":"media/07.mp4?v=5a96bdb231","type":"video","bytes":35851909},{"label":"08","src":"media/08.png?v=f98a7bd310","type":"image","bytes":4345830},{"label":"09a","src":"media/09a.png?v=42df789ff0","type":"image","bytes":3924322},{"label":"09b","src":"media/09b.png?v=98907bccd8","type":"image","bytes":5153210},{"label":"09c","src":"media/09c.jpg?v=0adbc8fa78","type":"image","bytes":271596},{"label":"09d","src":"media/09d.mp4?v=01e99208b5","type":"video","bytes":27422566,"volume":0.25},{"label":"10","src":"media/10.mp4?v=f89652bd08","type":"video","bytes":17763203},{"label":"11a","src":"media/11a.png?v=8dff2ada11","type":"image","bytes":2847862},{"label":"11b","src":"media/11b.mp4?v=789b0fd330","type":"video","bytes":5462871},{"label":"12a","src":"media/12a.png?v=aea930deab","type":"image","bytes":3449367},{"label":"12b","src":"media/12b.png?v=26e074dc5d","type":"image","bytes":3006273},{"label":"13","src":"media/13.png?v=cc558ba917","type":"image","bytes":4479616},{"label":"14","src":"media/14.png?v=83aa889145","type":"image","bytes":2749631},{"label":"15a","src":"media/15a.png?v=084cf627cc","type":"image","bytes":2668761},{"label":"15b","src":"media/15b.mp4?v=2dc60a8bab","type":"video","bytes":10420195},{"label":"16a","src":"media/16a.png?v=184e28d334","type":"image","bytes":5342545},{"label":"16b","src":"media/16b.mp4?v=5b9513d2d1","type":"video","bytes":10966223},{"label":"17a","src":"media/17a.png?v=78e67f0484","type":"image","bytes":1975960},{"label":"17b","src":"media/17b.mp4?v=b425717317","type":"video","bytes":29389988},{"label":"18a","src":"media/18a.mp4?v=561a67b379","type":"video","bytes":12426343},{"label":"18b","src":"media/18b.mp4?v=9946e5a304","type":"video","bytes":16805531},{"label":"19","src":"media/19.mp4?v=6ee5eca052","type":"video","bytes":33951381,"trimEnd":0.15}],CACHE='hang-chau-v2';
const stage=document.getElementById('stage'),message=document.getElementById('message'),back=document.getElementById('back'),next=document.getElementById('next'),counter=document.getElementById('counter'),offline=document.getElementById('offline');
const online=location.protocol.startsWith('http');
let index=0,started=false,current=null,blocked=false,loading=false,generation=0,offlineReady=false;
const pool=new Map(); // index -> element kept loaded off-screen for the slides around the current one
function status(){counter.textContent=`${index+1} / ${slides.length}`+(loading?' · đang tải…':'');back.disabled=!started||index===0;next.disabled=started&&!blocked&&index===slides.length-1;}
function notice(text){message.textContent=text;message.hidden=false;}
function dispose(media){if(media.tagName==='VIDEO'){media.pause();media.removeAttribute('src');media.load();}else media.removeAttribute('src');media.remove();}
function create(i){const s=slides[i],media=document.createElement(s.type==='video'?'video':'img');media.dataset.index=i;
 // loop=false: a finished video keeps its last frame; slides never advance on their own.
 if(s.type==='video'){media.playsInline=true;media.preload='auto';media.controls=false;media.loop=false;media.disablePictureInPicture=true;media.volume=s.volume??1;}
 else{media.alt='Slide '+s.label;media.decoding='async';}
 media.src=encodeURI(s.src);return media;}
// Resolves once the element can paint its first frame (or failed), so the previous slide stays on screen meanwhile: no black gap.
function ready(media){
 const loaded=media.tagName==='IMG'?media.decode().catch(()=>{}):media.readyState>=2||media.error?Promise.resolve():
  new Promise(r=>{for(const e of ['loadeddata','canplay','seeked','error'])media.addEventListener(e,r,{once:true});});
 return Promise.race([loaded,new Promise(r=>setTimeout(r,8000))]); // never leave the presenter stuck on the old slide
}
// Keep the previous and next slides loaded so Back and Next switch instantly. Online, only once everything is saved locally.
function neighbours(){if(online&&!offlineReady)return new Set();return new Set((started?[index-1,index+1]:[0]).filter(i=>i>=0&&i<slides.length));}
function keepNeighbours(){const want=neighbours();
 for(const [i,m] of pool)if(!want.has(i)){dispose(m);pool.delete(i);}
 for(const i of want)if(!pool.has(i)&&current?.dataset.index!=i)pool.set(i,create(i));}
// Some exports end on black frames: stop trimEnd seconds before the end so the last real frame stays on screen.
function stopEarly(media,trim,token){
 const stopAt=()=>media.duration-trim,stop=()=>{media.pause();media.currentTime=stopAt();};
 if(media.requestVideoFrameCallback){const watch=(now,frame)=>{if(token!==generation)return;if(frame.mediaTime>=stopAt()-0.04)stop();else media.requestVideoFrameCallback(watch);};media.requestVideoFrameCallback(watch);}
 else media.addEventListener('timeupdate',function check(){if(token!==generation||media.currentTime>=stopAt()-0.3){media.removeEventListener('timeupdate',check);if(token===generation)setTimeout(()=>{if(token===generation)stop();},Math.max(0,stopAt()-media.currentTime)*1000);}});
}
function retire(media){const i=+media.dataset.index;media.remove();
 if(neighbours().has(i)&&!pool.has(i)){if(media.tagName==='VIDEO'){media.pause();media.currentTime=0;}pool.set(i,media);}else dispose(media);}
async function show(i){
 const token=++generation;index=i;blocked=false;loading=false;const s=slides[i];status();
 const media=pool.get(i)||create(i);pool.delete(i);
 if(!media.isConnected)stage.prepend(media); // underneath whatever is on screen now
 const slow=setTimeout(()=>{if(token===generation){loading=true;status();}},300);
 await ready(media);clearTimeout(slow);
 if(token!==generation)return;
 loading=false;current=media;message.hidden=true;
 for(const el of [...stage.querySelectorAll('video,img')])if(el!==media)retire(el);
 if(media.tagName==='VIDEO'?media.error:!media.naturalWidth)notice('Không tải được slide '+s.label+'. '+(online?'Kiểm tra mạng rồi nhấn Back và Next để thử lại.':'Vui lòng giữ HTML cùng các thư mục ảnh/video.'));
 else if(media.tagName==='VIDEO'){if(s.trimEnd)stopEarly(media,s.trimEnd,token);media.play().catch(()=>{if(token!==generation)return;blocked=true;notice('Trình duyệt đang chặn tự phát. Nhấn Next để phát video này.');status();});}
 keepNeighbours();status();
}
next.addEventListener('click',()=>{
 if(!started){started=true;show(0);return;}
 if(blocked&&current?.tagName==='VIDEO'){const media=current,token=generation;media.play().then(()=>{if(token!==generation)return;blocked=false;message.hidden=true;status();}).catch(()=>notice('Chưa phát được video. Nhấn Next để thử lại.'));return;}
 if(index<slides.length-1)show(index+1);
});
back.addEventListener('click',()=>{if(started&&index>0)show(index-1);});
// Presentation clickers send arrow / Page keys.
document.addEventListener('keydown',e=>{
 if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();if(!next.disabled)next.click();}
 if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();if(!back.disabled)back.click();}
});
const total=slides.reduce((n,s)=>n+(s.bytes||0),0),mb=n=>Math.round(n/1e6);
function offlineStatus(text,cls){offline.textContent=text;offline.className=cls||'';}
// Online: save every slide into the browser, one file at a time in slide order, so the deck plays smoothly and offline.
async function saveOffline(){
 if(!online||!('serviceWorker' in navigator)||!window.caches)return;
 document.getElementById('hint').textContent='Mở link sẵn trước giờ chiếu và đợi góc phải báo “✓ Đã lưu offline” để chiếu mượt, không cần mạng.';
 try{await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;}catch{return;}
 const cache=await caches.open(CACHE);let saved=0,count=0;const missing=[];
 // Drop saved files this version no longer uses (replaced videos have a new ?v= address).
 const wanted=new Set(slides.map(s=>new URL(s.src,location.href).href));
 for(const req of await cache.keys())if(new URL(req.url).pathname.includes('/media/')&&!wanted.has(req.url))await cache.delete(req);
 for(const s of slides){if(await cache.match(s.src)){saved+=s.bytes;count++;}else missing.push(s);}
 const progress=()=>offlineStatus(`Đang lưu offline ${count}/${slides.length} · ${mb(saved)}/${mb(total)} MB`);
 if(missing.length){
  navigator.storage?.persist?.().catch(()=>{});
  const est=await navigator.storage?.estimate?.().catch(()=>null);
  if(est&&est.quota-est.usage<total-saved){offlineStatus('⚠ Trình duyệt không đủ chỗ lưu offline (cần ~'+mb(total-saved)+' MB). Đừng dùng tab ẩn danh.','warn');return;}
  progress();
  for(const s of missing){
   const r=await fetch(s.src,{cache:'reload'}).catch(()=>null),fail=()=>offlineStatus('⚠ Lưu offline bị gián đoạn. Kiểm tra mạng rồi tải lại trang để lưu tiếp.','warn');
   if(!r||r.status!==200)return fail();
   const before=saved;let last=0;
   const body=r.body.pipeThrough(new TransformStream({transform(chunk,ctl){saved+=chunk.length;if(Date.now()-last>500){last=Date.now();progress();}ctl.enqueue(chunk);}}));
   try{await cache.put(s.src,new Response(body,{headers:{'Content-Type':r.headers.get('Content-Type')||''}}));}catch{saved=before;return fail();}
   saved=before+s.bytes;count++;progress();
  }
 }
 offlineReady=true;offlineStatus('✓ Đã lưu offline · chiếu không cần mạng','ok');keepNeighbours();
}
status();keepNeighbours();saveOffline();
</script>
</body>
</html>
